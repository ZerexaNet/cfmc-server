# ============================================================
# CFMC-Edge — Cloudflare 配置文件 (wrangler v4)
#
# 两种部署路径:
#   A. 一键部署 (推荐): 点击 README 顶部的 Deploy to Cloudflare 按钮 —
#      平台读取本文件自动创建并绑定 KV/D1 资源, 占位符 ID 无需手动替换;
#      Secrets 按提示输入 (清单见 .dev.vars.example)
#   B. 手动部署: `bash scripts/init-d1.sh` 建库回填 ID → `npm run deploy`
#      (deploy 脚本会先自动应用 migrations/ 下的 D1 建表迁移)
#
# 设计说明:
#   - 本地开发 (wrangler dev) 不需要真实 ID: D1/KV 均由 miniflare 本地模拟,
#     占位符不影响本地运行
#   - R2 与 Queue 默认注释: R2 需在 Dashboard 开通一次 (免费, 但账号需绑定
#     支付方式), Queue 需 Workers Paid 计划 — 二者当前代码尚未消费 (预留
#     绑定), 注释掉不影响任何功能; 需要时取消注释并重新部署 (见 DEPLOYMENT.md 3.5)
# ============================================================

name = "cfmc-server"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# HTML 文本导入规则: index.js `import panelHtml from './admin/panel.html'`
# fallthrough = true: 命中 *.html 后继续走 wrangler 默认 Text 规则 (*.txt/*.sql), 消除 no-fallback 警告
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# ============================================================
# Durable Objects 类定义
# ------------------------------------------------------------
# 为什么用 DO 而不是普通 Worker:
#   1. DO 提供单一写入点 (强一致), 天然适合"一个区域一个引擎"的模型
#   2. DO 内置 Storage + Alarm, 可以实现 20TPS 游戏循环
#   3. 实例数量无上限, 每个区域 (16x16区块) 一个 RegionDO, 水平无限扩展
# ============================================================
[[durable_objects.bindings]]
name = "WORLD_MANAGER"
class_name = "WorldManagerDO"

[[durable_objects.bindings]]
name = "REGION"
class_name = "RegionDO"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatDO"

# DO 类必须声明迁移, 否则部署时报错 (本地 dev 可省略, 但保留以兼容远程部署)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldManagerDO", "RegionDO", "ChatDO"]

# ============================================================
# D1 数据库绑定 (Serverless SQLite)
# ------------------------------------------------------------
# 为什么地图数据放 D1 而不是 DO 内置 Storage:
#   - D1 支持 SQL 查询 (跨区域统计/反作弊审计/世界导出)
#   - DO Storage 适合小体量 KV, 大体量区块数据用 D1 更经济
# migrations_dir: wrangler 标准迁移目录, `npm run deploy` 自动按序应用
#   (0001_init.sql 全幂等, 对已建表的老库重跑无副作用)
# ============================================================
[[d1_databases]]
binding = "USERS_DB"
database_name = "cfmc-users"
database_id = "339ddaec-1859-484d-ba5b-2610295aff8d"      # 一键部署自动供给; 手动部署由 init-d1.sh 回填
migrations_dir = "src/storage/migrations/users"

[[d1_databases]]
binding = "WORLD_DB"
database_name = "cfmc-world"
database_id = "959c2a50-6f19-47ff-bc14-f4a0ee111780"      # 同上
migrations_dir = "src/storage/migrations/world"

# ============================================================
# KV 命名空间 (最终一致, 读多写少场景)
# 用途: 会话缓存 / 在线状态 / 皮肤纹理缓存 / Refresh Token
# ============================================================
[[kv_namespaces]]
binding = "CACHE"
id = "3b2101056fdf43f9ba8ede3dc5d92fc5"           # 一键部署自动供给; 手动部署: wrangler kv namespace create CACHE 后替换

# ============================================================
# R2 存储桶 (S3 兼容对象存储) — 可选, 默认关闭
# ------------------------------------------------------------
# 用途: 世界备份归档 / 大文件 (启动画面/资源包) 托管
# 启用步骤: Dashboard → R2 页面开通 (免费, 需绑定支付方式) →
#           取消下面注释 → 重新部署 (或 `npx wrangler r2 bucket create cfmc-backups` 手动建桶)
# ============================================================
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "cfmc-backups"


# ============================================================
# Queue (异步任务队列) — 可选, 默认关闭 (需 Workers Paid 计划)
# ------------------------------------------------------------
# 用途: 削峰 —— 把非实时任务 (统计上报/Discord桥接/批量备份) 从
#       Tick 循环剥离, 避免 DO CPU 超时
# ⚠️ wrangler v4 语法: 顶层 queues 必须是对象 —— 生产者写 [[queues.producers]],
#    消费者写 [[queues.consumers]]。直接写 [[queues]] 取消注释会报错:
#    'The field "queues" should be an object but got [...]'
# ⚠️ 绑定名 ≠ 队列名: binding 是代码里 env.XXX 引用的名字, queue 是
#    wrangler queues create 创建的真实队列名 (建议 cfmc-events)
# 启用步骤: 升级 Workers Paid → `npx wrangler queues create cfmc-events`
#           → 取消下面注释 → 重新部署
# 说明: 当前代码尚未引用 env.EVENTS_QUEUE (预留绑定), 纯生产者绑定可
#    安全启用; 若还需配消费者 [[queues.consumers]], 必须先在 src/index.js
#    导出 async queue(batch, env, ctx) handler, 否则部署会被 API 拒绝
# ============================================================
[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "cfmc-events"

# ============================================================
# 环境变量 (与 [vars] 同名, RegionDO/Auth Worker 内通过 env.XXX 读取)
# ============================================================
[vars]
ENVIRONMENT = "development"
DEFAULT_AUTH_MODE = "offline"            # online / offline / skin_server / hybrid
DEFAULT_SKIN_SERVER = "https://ely.by"  # 或 https://littleskin.cn 或自建地址
MAX_PLAYERS_PER_REGION = "25"
TICK_RATE_MS = "50"                     # 20 TPS
PERSIST_INTERVAL_MS = "5000"            # 5秒持久化一次
VIEW_DISTANCE = "6"                     # 区块视距
COMPRESSION_THRESHOLD = "256"           # 超过此大小的包才压缩
# ---- Phase 3/4 ----
ADMIN_ORIGIN = "*"                       # 管理面板域名 (CORS 收敛; 空 = 开发期 *)
RECONNECT_GRACE_MS = "60000"            # 断线重连宽限 (期内恢复原状态)
MAX_ENTITIES_PER_REGION = "12"          # 单区域实体上限 (怪物 AI)
CHAT_RATE_LIMIT = "5"                   # 聊天限流: 条数/窗口
CHAT_RATE_WINDOW_MS = "5000"            # 聊天限流窗口
CHAT_HISTORY_SIZE = "100"               # 聊天历史保留条数
# Secrets (wrangler secret put, 不写在本文件; 一键部署时按 .dev.vars.example 提示输入):
#   AUTH_JWT_SECRET     — JWT 签名密钥 (认证, 必需)
#   ADMIN_TOKEN         — Web 面板/管理 API 令牌 (Phase 3, 必需)
#   ALERT_WEBHOOK_URL   — 告警 webhook (如 Discord/飞书, 可选)

# ============================================================
# Placement (智能路由)
# smart 模式让 CF 把 DO 实例放置在离"主要访问者"最近的DC,
# 对 Minecraft 这种单区域多人交互场景可降低跨玩家 RTT
# ============================================================
[placement]
mode = "smart"

# ============================================================
# 本地开发配置
# ============================================================
[dev]
port = 8787

# ------------------------------------------------------------
# 环境差异配置 (部署生产环境: wrangler deploy --env production)
# ------------------------------------------------------------
[env.production.vars]
ENVIRONMENT = "production"
